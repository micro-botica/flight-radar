name: Claude review

# Automatic code review when a pull request is opened or marked ready for review.
# Usage is billed to the Claude subscription of the PR author:
#   MVelden1  -> secret CLAUDE_TOKEN_MICK
#   Remotev2  -> secret CLAUDE_TOKEN_MAARTEN
# Draft PRs are skipped. Comment "@claude review this again" for a new review after more commits.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.pull_request.user.login == 'MVelden1' || github.event.pull_request.user.login == 'Remotev2')
    runs-on: ubuntu-latest
    env:
      AUTHOR: ${{ github.event.pull_request.user.login }}
      PERSON: ${{ github.event.pull_request.user.login == 'Remotev2' && 'MAARTEN' || 'MICK' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check that a token exists for the PR author
        env:
          TOKEN: ${{ secrets[format('CLAUDE_TOKEN_{0}', github.event.pull_request.user.login == 'Remotev2' && 'MAARTEN' || 'MICK')] }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret CLAUDE_TOKEN_${PERSON} is missing. ${AUTHOR} has to add their own token first (see CLAUDE.md)."
            exit 1
          fi
          echo "Reviewing on the Claude subscription of ${AUTHOR}."

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets[format('CLAUDE_TOKEN_{0}', github.event.pull_request.user.login == 'Remotev2' && 'MAARTEN' || 'MICK')] }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow the rules in CLAUDE.md.

            Focus on:
            - Bugs and logic errors
            - Memory and performance problems on the ESP32-S3 (heap use, blocking calls, large stack buffers)
            - Secrets or credentials that should not be committed
            - Readability and consistency with the rest of the code
            - Whether the PR matches the issue it closes

            Keep it short and practical. Explain why something is a problem and suggest a fix.
            If the PR looks good, say so in one or two sentences.
            Post one summary comment with `gh pr comment` and use inline comments only for specific lines.
            Do not change any files and do not push commits.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
