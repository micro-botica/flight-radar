; Flight Radar firmware for the Waveshare ESP32-S3-Touch-LCD-2.1
; (ESP32-S3R8: 16 MB flash, 8 MB octal PSRAM).

[platformio]
default_envs = waveshare_s3_lcd_21

[env:waveshare_s3_lcd_21]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Flash: 16 MB, QIO. PSRAM: 8 MB octal (OPI).
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Same C++ standard as the native tests. The ESP32 Arduino core defaults to
; gnu++11, which rejects C++14 code that the native build accepts.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE

lib_deps =
    lvgl/lvgl@~8.4.0
    moononournation/GFX Library for Arduino@~1.5.9

; Host-side tests of the Wi-Fi logic, no board needed:
;   pio run -e native && .pio/build/native/program
; Uses fixed fallback credentials instead of secrets.h.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DWIFI_SSID=\"fallback-ssid\"
    -DWIFI_PASSWORD=\"fallback-pass\"
build_src_filter =
    -<*>
    +<data/wifi_manager.cpp>
    +<../test_native/>
